services:
  postgres:
    image: postgres:16-alpine
    container_name: darpan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: darpan
      POSTGRES_PASSWORD: darpan
      POSTGRES_DB: darpan
    ports:
      - "5432:5432"
    volumes:
      - darpan-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darpan -d darpan"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  darpan-pgdata:
