<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Darpan — Tickers and Positions design mockups</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;--bg:#0d1016;--surface:#141a23;--soft:#11161e;--line:#222b39;--text:#f4f6fa;--muted:#aab2c0;--dim:#7f8a9b;--accent:#6e8bff;--pos:#34d399;--neg:#fb7185;--warn:#e3a857}
    *{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#090c12;color:var(--text)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.preview-controls{max-width:1216px;margin:0 auto;padding:22px 18px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.preview-title{font-size:14px;font-weight:700;letter-spacing:.02em}.preview-title span{display:block;margin-top:4px;color:var(--muted);font-size:12px;font-weight:400}.control-groups{display:flex;gap:10px;flex-wrap:wrap}.control-group{display:flex;gap:3px;padding:3px;background:#171d28;border:1px solid #2b3444;border-radius:9px}.control-group button{border:0;background:transparent;color:#aab2c0;padding:7px 11px;border-radius:6px;font-size:12px;font-weight:650}.control-group button.selected{background:#2b3651;color:#f4f6fa}.preview-area{min-height:calc(100vh - 86px);padding:0 18px 30px;display:flex;justify-content:center;align-items:flex-start}.app{width:min(1180px,100%);height:min(900px,calc(100vh - 124px));min-height:650px;overflow:auto;background:var(--bg);border:1px solid #2c3546;border-radius:14px;box-shadow:0 30px 80px #0007}.app.mobile{width:390px;height:844px;min-height:844px;border-radius:12px}.shell{height:62px;position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px}.brand{font-size:21px;font-weight:750;letter-spacing:-.04em;display:flex;align-items:center;gap:9px}.brandmark{width:28px;height:28px;display:inline-grid;place-items:center;border-radius:7px;background:linear-gradient(145deg,#8b7dff,#4d6eff);color:white;font-size:17px}.topnav{display:flex;align-items:center;gap:6px}.topnav span{padding:9px 12px;color:var(--muted);font-size:13px;font-weight:560}.topnav span.active{color:var(--text);background:#222c40;border-radius:7px}.shell-right{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:12px}.year{padding:7px 9px;border:1px solid var(--line);border-radius:6px}.page{max-width:1080px;margin:0 auto;padding:30px 30px 55px}.eyebrow{text-transform:uppercase;letter-spacing:.13em;color:var(--accent);font-size:10px;font-weight:750;margin-bottom:9px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:23px}.page h1{font-size:32px;line-height:1.05;letter-spacing:-.045em;margin:0 0 7px;font-weight:720}.subtitle{color:var(--muted);font-size:13px}.meta{font-size:12px;color:var(--muted);white-space:nowrap}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 12px}.left-tools,.right-tools{display:flex;align-items:center;gap:11px;flex-wrap:wrap}.seg{display:inline-flex;gap:3px;background:#1a2230;border:1px solid #293345;border-radius:8px;padding:3px}.seg span{padding:7px 13px;border-radius:5px;font-size:12px;font-weight:650;color:var(--muted);white-space:nowrap}.seg span.on{background:#344264;color:white}.search{height:34px;width:216px;padding:0 11px;border:1px solid #2c3646;background:var(--surface);color:var(--text);border-radius:8px;font-size:12px}.search::placeholder{color:#8995a7}.order{height:34px;padding:0 12px;border:1px solid #2c3646;background:var(--surface);color:var(--muted);border-radius:8px;font-size:12px}.section-label{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:22px 0 11px}.section-label h2{margin:0;font-size:16px;letter-spacing:-.015em;font-weight:680}.section-label .helper{font-size:11px;color:var(--muted)}.table{width:100%;border-collapse:collapse;table-layout:fixed;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}.table th{background:#171e29;text-align:left;color:var(--muted);font-size:11px;font-weight:650;padding:12px 16px;border-bottom:1px solid var(--line)}.table td{padding:13px 16px;border-bottom:1px solid #202836;font-size:13px;vertical-align:middle}.table tr:last-child td{border-bottom:none}.table tbody tr{cursor:pointer}.table tbody tr:hover{background:#1c2635}.right{text-align:right!important}.ticker-name{font-weight:700;letter-spacing:.01em}.ticker-name small{display:block;font-weight:450;color:var(--muted);font-size:11px;margin-top:3px;letter-spacing:0}.num{font-variant-numeric:tabular-nums;font-weight:650}.positive{color:var(--pos)}.negative{color:var(--neg)}.muted{color:var(--muted)}.foot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);margin:11px 3px}.foot strong{font-weight:600;color:var(--text)}.textlink{color:var(--accent);font-weight:650}.bottomnav{display:none}.mobile-list{display:none}.split-header{display:flex;align-items:center;justify-content:space-between;gap:10px}.compact-stat{display:flex;align-items:center;gap:16px;margin-bottom:17px;padding:12px 16px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}.compact-stat strong{font-size:13px;white-space:nowrap}.compact-stat .details{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:11px}.meter{height:5px;width:100px;border-radius:20px;background:#333b48;overflow:hidden}.meter i{display:block;background:var(--warn);height:100%;width:100%}.over{color:var(--warn);font-weight:650}.filters{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 5px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid #303a4a;color:var(--muted);border-radius:99px;font-size:11px;font-weight:650;padding:7px 12px}.chip.on{color:#d5dfff;border-color:#5a6bb0;background:#283453}.book-table th:nth-child(1){width:23%}.book-table th:nth-child(2){width:19%}.book-table th:nth-child(3){width:18%}.book-table th:nth-child(4){width:14%}.book-table th:nth-child(5){width:9%}.stage{display:inline-flex;border-radius:5px;padding:4px 7px;background:#493a28;color:#f0b86b;font-size:10px;font-weight:650}.stage.neutral{background:#263a39;color:#8fd8c0}.stats-ribbon{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 15px;background:#151d28;border:1px solid var(--line);border-radius:8px;margin:19px 0 6px}.stats-ribbon .label{color:var(--muted);font-size:11px}.stats-ribbon strong{display:block;font-size:14px;margin-top:2px;font-variant-numeric:tabular-nums}.stats-ribbon .stat{padding-right:20px;border-right:1px solid var(--line)}.stats-ribbon .stat:last-of-type{border-right:0}.stats-ribbon .more{color:var(--accent);font-size:11px;font-weight:650;white-space:nowrap}.mobile-only{display:none}
    .app.mobile .shell{height:59px;padding:0 16px}.app.mobile .brand{font-size:20px}.app.mobile .shell-right,.app.mobile .topnav{display:none}.app.mobile .shell:after{content:'⋯';color:var(--muted);font-size:22px}.app.mobile .page{padding:24px 16px 85px}.app.mobile .page h1{font-size:29px}.app.mobile .page-head{margin-bottom:18px}.app.mobile .page-head .meta{display:none}.app.mobile .toolbar{display:block}.app.mobile .left-tools,.app.mobile .right-tools{width:100%;display:flex;justify-content:space-between}.app.mobile .right-tools{margin-top:10px}.app.mobile .search{flex:1;min-width:0}.app.mobile .order{width:123px}.app.mobile .table{display:none}.app.mobile .mobile-list{display:block;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}.app.mobile .mobile-row{padding:13px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.app.mobile .mobile-row:last-child{border-bottom:0}.app.mobile .mobile-row .title{font-size:14px;font-weight:720}.app.mobile .mobile-row .sub{color:var(--muted);font-size:11px;margin-top:4px;line-height:1.3}.app.mobile .mobile-row .pnl{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}.app.mobile .mobile-row .roc{color:var(--muted);font-size:11px;margin-top:5px;text-align:right;font-variant-numeric:tabular-nums}.app.mobile .bottomnav{height:66px;position:sticky;bottom:0;z-index:5;background:#141a23;border-top:1px solid #293345;display:flex;align-items:center;justify-content:space-around;font-size:10px;color:var(--muted)}.app.mobile .bottomnav span{display:flex;flex-direction:column;align-items:center;gap:4px}.app.mobile .bottomnav b{font-size:15px;font-weight:500}.app.mobile .bottomnav .on{color:var(--accent)}.app.mobile .compact-stat{display:block;padding:11px 12px;margin-bottom:15px}.app.mobile .compact-stat strong{display:block;font-size:12px}.app.mobile .compact-stat .details{margin-top:5px;display:block;line-height:1.5}.app.mobile .compact-stat .meter{display:none}.app.mobile .filters{display:block}.app.mobile .filters .chips{margin-top:11px}.app.mobile .section-label{margin-top:18px}.app.mobile .stats-ribbon{display:flex;flex-wrap:wrap;gap:10px 0;padding:11px 12px}.app.mobile .stats-ribbon .stat{width:33.3%;padding:0 8px}.app.mobile .stats-ribbon .stat:first-child{padding-left:0}.app.mobile .stats-ribbon .stat:nth-child(3){border:0}.app.mobile .stats-ribbon .more{width:100%;padding-top:7px;border-top:1px solid var(--line)}.app.mobile .book-mobile .mobile-row{align-items:flex-start}.app.mobile .book-mobile .mobile-row .sub{max-width:235px}.app.mobile .foot{margin-bottom:14px}.app.mobile .mobile-only{display:block}
    .app.mobile .section-label{display:block}.app.mobile .section-label .helper{display:block;margin-top:5px}
    @media(max-width:550px){.preview-controls{display:block}.control-groups{margin-top:13px}.preview-area{padding:0 0 20px}.app{border-radius:0!important;width:100%!important;height:calc(100vh - 134px)!important;min-height:600px!important}.app:not(.mobile) .page{padding:20px 15px}.app:not(.mobile) .shell{padding:0 15px}.app:not(.mobile) .topnav{display:none}.preview-title{margin-bottom:8px}}
  </style>
</head>
<body>
  <div class="preview-controls">
    <div class="preview-title">Darpan / Tickers and Positions<span>Switch screen, category, and device · in-screen controls are illustrative · all data is synthetic</span></div>
    <div class="control-groups" aria-label="Mockup controls">
      <div class="control-group" id="screen-control"><button type="button" data-screen="tickers" class="selected">Tickers</button><button type="button" data-screen="positions">Positions</button></div>
      <div class="control-group" id="category-control" hidden><button type="button" data-category="options" class="selected">Options</button><button type="button" data-category="stocks">Stock trades</button></div>
      <div class="control-group" id="device-control"><button type="button" data-device="desktop" class="selected">Desktop</button><button type="button" data-device="mobile">Mobile</button></div>
    </div>
  </div>
  <div class="preview-area"><div class="app" id="app"></div></div>
  <script>
    const state={screen:'tickers',category:'options',device:'desktop'};
    const trows=[['MSFT','Microsoft','+$8,240','18.2%','14','79%'],['NVDA','NVIDIA','+$5,960','22.4%','11','73%'],['AAPL','Apple','+$3,180','12.6%','9','67%'],['AMZN','Amazon','+$2,420','16.4%','8','75%'],['TSLA','Tesla','+$1,370','9.1%','6','67%'],['AMD','AMD','+$940','7.2%','5','60%'],['META','Meta','−$420','−3.8%','4','25%'],['PYPL','PayPal','−$1,540','−18.5%','5','20%']];
    const openOptions=[['NVDA','$150 put','Cash-secured put','Roll soon','Oct 2','5d','+$780'],['AMZN','$250 call','Covered call','Roll soon','Oct 2','5d','+$360'],['AAPL','$260 call','Covered call','Working','Oct 9','12d','+$450'],['MSFT','$460 call','Covered call','Working','Oct 16','19d','+$620'],['AMD','$180 put','Cash-secured put','Working','Oct 16','19d','+$520']];
    const closedOptions=[['NVDA','$145 put','Cash-secured put','Expired','Sep 25','7d','+$690'],['MSFT','$455 call','Covered call','Closed','Sep 24','12d','+$510'],['AAPL','$255 call','Covered call','Assigned','Sep 22','18d','+$1,120']];
    const closedStocks=[['MSFT','40 shares','Closed','Sep 25','+$2,140','10.2%'],['AMZN','25 shares','Closed','Sep 23','+$760','5.1%'],['PYPL','100 shares','Closed','Sep 19','−$1,540','−18.5%'],['AAPL','30 shares','Closed','Sep 15','+$890','7.8%']];
    const tone=v=>v.startsWith('−')?'negative':'positive';
    const nav=active=>`<div class="shell"><div class="brand"><span class="brandmark">⌁</span>Darpan</div><div class="topnav"><span>Home</span><span>Monthly</span><span class="${active==='tickers'?'active':''}">Tickers</span><span class="${active==='positions'?'active':''}">Positions</span><span>Taxes</span></div><div class="shell-right"><span class="year">2026 ⌄</span><span>◎</span></div></div>`;
    const bottom=active=>`<div class="bottomnav"><span><b>⌂</b>Home</span><span><b>▦</b>Monthly</span><span class="${active==='tickers'?'on':''}"><b>♜</b>Tickers</span><span class="${active==='positions'?'on':''}"><b>◇</b>Positions</span><span><b>▤</b>Taxes</span></div>`;
    const tickerTable=()=>`<table class="table"><thead><tr><th style="width:30%">Symbol ↕</th><th class="right">Realized P&amp;L ↓</th><th class="right">Realized RoC ↕</th><th class="right">Trades ↕</th><th class="right">Win rate ↕</th></tr></thead><tbody>${trows.map(r=>`<tr><td class="ticker-name">${r[0]}<small>${r[1]}</small></td><td class="right num ${tone(r[2])}">${r[2]}</td><td class="right num ${tone(r[3])}">${r[3]}</td><td class="right num">${r[4]}</td><td class="right num">${r[5]}</td></tr>`).join('')}</tbody></table>`;
    const tickerMobile=()=>`<div class="mobile-list">${trows.map(r=>`<div class="mobile-row"><div><div class="title">${r[0]}</div><div class="sub">${r[4]} closed trades · ${r[5]} win</div></div><div><div class="pnl ${tone(r[2])}">${r[2]}</div><div class="roc">RoC ${r[3]}</div></div></div>`).join('')}</div>`;
    function tickers(){return `${nav('tickers')}<main class="page"><div class="eyebrow">Symbol analysis</div><div class="page-head"><div><h1>Tickers</h1><div class="subtitle">Realized results by symbol in 2026</div></div><div class="meta">28 symbols · 142 closed events</div></div><div class="toolbar"><div class="left-tools"><div class="seg"><span class="on">All symbols</span><span>Winners</span><span>Losers</span></div></div><div class="right-tools"><input class="search" aria-label="Search symbols" placeholder="Search symbols…"><button class="order" type="button">P&amp;L ↓</button></div></div>${tickerTable()}${tickerMobile()}<div class="foot"><span>Showing <strong>8 of 28 symbols</strong></span><span class="textlink">Next page →</span></div></main>${bottom('tickers')}`}
    const optionTable=(items,closed=false)=>`<table class="table book-table"><thead><tr><th>Position</th><th>Strategy</th><th>Stage</th><th class="right">${closed?'Closed':'Expiry'}</th><th class="right">${closed?'Days':'DTE'}</th><th class="right">${closed?'Realized P&amp;L':'Premium received'}</th></tr></thead><tbody>${items.map(r=>`<tr><td class="ticker-name">${r[0]}<small>${r[1]}</small></td><td class="muted">${r[2]}</td><td><span class="stage ${r[3]==='Working'?'neutral':''}">${r[3]}</span></td><td class="right num muted">${r[4]}</td><td class="right num ${!closed&&r[5]==='5d'?'over':'muted'}">${r[5]}</td><td class="right num ${tone(r[6])}">${r[6]}</td></tr>`).join('')}</tbody></table>`;
    const bookMobile=(items,closed=false)=>`<div class="mobile-list book-mobile">${items.map(r=>`<div class="mobile-row"><div><div class="title">${r[0]} <span class="muted" style="font-weight:500">${r[1]}</span></div><div class="sub">${r[2]} · ${r[3]} · ${closed?'Closed':'Expires'} ${r[4]}${closed?'':' · '+r[5]}</div></div><div><div class="pnl ${tone(r[6])}">${r[6]}</div><div class="roc">${closed?'Realized':'Premium'}</div></div></div>`).join('')}</div>`;
    const stockTable=()=>`<table class="table"><thead><tr><th>Position</th><th class="right">Closed</th><th class="right">Realized P&amp;L</th><th class="right">Trade ROI</th></tr></thead><tbody>${closedStocks.map(r=>`<tr><td class="ticker-name">${r[0]}<small>${r[1]}</small></td><td class="right muted">${r[3]}</td><td class="right num ${tone(r[4])}">${r[4]}</td><td class="right num ${tone(r[5])}">${r[5]}</td></tr>`).join('')}</tbody></table>`;
    const stockMobile=()=>`<div class="mobile-list book-mobile">${closedStocks.map(r=>`<div class="mobile-row"><div><div class="title">${r[0]} <span class="muted" style="font-weight:500">${r[1]}</span></div><div class="sub">Closed ${r[3]} · Trade ROI ${r[5]}</div></div><div><div class="pnl ${tone(r[4])}">${r[4]}</div><div class="roc">Realized</div></div></div>`).join('')}</div>`;
    const ribbon=stock=>`<div class="stats-ribbon"><div class="stat"><span class="label">Closed trade P&amp;L</span><strong class="positive">${stock?'+$3,870':'+$18,420'}</strong></div><div class="stat"><span class="label">Win rate</span><strong>${stock?'71%':'68%'}</strong></div><div class="stat"><span class="label">Closed trades</span><strong>${stock?'16':'73'}</strong></div><span class="more">More closed trade stats ⌄</span></div>`;
    function positions(){const stock=state.category==='stocks';return `${nav('positions')}<main class="page"><div class="eyebrow">Open book and trade record</div><div class="page-head"><div><h1>Positions</h1><div class="subtitle">Options and stock trades in 2026</div></div><div class="meta">2026 · All accounts</div></div><div class="compact-stat"><strong>Inferred open exposure <span class="over">$128,000 / $100,000 · 128%</span></strong><div class="meter"><i></i></div><div class="details">Above configured max by $28,000 · Imported positions, not a live broker balance <span class="textlink">ⓘ</span></div></div><div class="filters"><div class="seg"><span class="${!stock?'on':''}">Options</span><span class="${stock?'on':''}">Stock trades</span></div><div class="seg"><span class="on">All</span>${stock?'':'<span>Active</span>'}<span>Closed</span></div>${stock?'':'<div class="chips"><span class="chip on">All strategies</span><span class="chip">CSP</span><span class="chip">CC</span><span class="chip">Long</span></div>'}</div>${stock?`<div class="section-label"><h2>Closed stock trades <span class="muted">16</span></h2><span class="helper">Open stock holdings are not enabled in Settings</span></div>${ribbon(true)}<div class="toolbar" style="margin-top:14px"><input class="search" placeholder="Search stock trades…" aria-label="Search stock trades"><button class="order">Newest ↓</button></div>${stockTable()}${stockMobile()}<div class="foot"><span>Showing <strong>4 of 16 trades</strong></span><span class="textlink">Next page →</span></div>`:`<div class="section-label"><h2>Open options <span class="muted">5</span></h2><span class="helper">Showing nearest expiry first</span></div>${optionTable(openOptions)}${bookMobile(openOptions)}<div class="section-label"><h2>Closed options <span class="muted">73</span></h2><span class="helper">Realized results in 2026</span></div>${ribbon(false)}<div class="toolbar" style="margin-top:14px"><input class="search" placeholder="Search closed trades…" aria-label="Search closed trades"><button class="order">Newest ↓</button></div>${optionTable(closedOptions,true)}${bookMobile(closedOptions,true)}<div class="foot"><span>Showing <strong>3 of 73 trades</strong></span><span class="textlink">Next page →</span></div>`}</main>${bottom('positions')}`}
    function render(){document.getElementById('app').className='app '+(state.device==='mobile'?'mobile':'');document.getElementById('app').innerHTML=state.screen==='tickers'?tickers():positions();document.getElementById('category-control').hidden=state.screen!=='positions';document.querySelectorAll('[data-screen],[data-category],[data-device]').forEach(b=>{const k=b.dataset.screen?'screen':b.dataset.category?'category':'device';b.classList.toggle('selected',b.dataset[k]===state[k])});location.hash=[state.screen,state.screen==='positions'?state.category:null,state.device].filter(Boolean).join('-')}
    document.querySelectorAll('[data-screen],[data-category],[data-device]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.screen?'screen':b.dataset.category?'category':'device';state[k]=b.dataset[k];render()}));
    const hash=location.hash.slice(1).split('-');if(hash[0]==='positions'||hash[0]==='tickers')state.screen=hash[0];if(hash.includes('stocks'))state.category='stocks';if(hash.includes('mobile'))state.device='mobile';render();
  </script>
</body>
</html>
